# Project planning references. R1 projects keep R1 IDs; R2 never changes their status.
# Forecast projects (PRJ-000101 onward) are synthetic pipeline entries that do not exist in
# R1 yet; when one is created in R1, R1 owns its record.
# curve_start_period is the period in which the first segment of the tier's phase-effort
# curve falls. For R1 projects it is chosen so the curve's launch segment falls in the
# month of the R1 target launch date; the validator checks this. It is an R2 planning
# anchor, not R1 phase state.
projects:
  - {project_id: PRJ-000001, scenario_id: SCN-000001, source: r1, complexity_tier: standard, curve_start_period: "2026-07"}
  - {project_id: PRJ-000002, scenario_id: SCN-000002, source: r1, complexity_tier: standard, curve_start_period: "2026-06"}
