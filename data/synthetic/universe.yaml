# Synthetic planning universe: the only hand-authored synthetic input in this repository.
# All of it is synthetic data and an illustrative example.
# tools/capacity_calc.py builds every CSV and the event file in this folder from it, plus the pinned R3 Capacity Inputs.
# No record describes a real person, team, customer, or organization.
# People appear only as PER IDs with neutral labels.
# Every hour, count, and factor here is a proposed design value, not a measured result.
version: "1.0.0"

scenarios:
  - {scenario_id: SCN-000001, label: Scenario A, org_stage: startup, org_profile_id: ORG-000001, selected_by: PER-000001, selected_at: "2026-09-01T14:00:00Z"}
  - {scenario_id: SCN-000002, label: Scenario B, org_stage: early_scale, org_profile_id: ORG-000002, selected_by: PER-000002, selected_at: "2026-09-01T15:00:00Z"}
  - {scenario_id: SCN-000003, label: Scenario C, org_stage: structured_growth, org_profile_id: ORG-000003, selected_by: PER-000003, selected_at: "2026-09-01T16:00:00Z"}
  - {scenario_id: SCN-000004, label: Scenario D, org_stage: mature, org_profile_id: ORG-000004, selected_by: PER-000010, selected_at: "2026-09-01T17:00:00Z"}

# Supply inputs. Each allocation is one person in one role; a person in a small team may
# hold several roles, each with its own share of scheduled hours. Overrides change one
# field for one period. ramp_factors are R4 interface fixtures.
people:
  - person_id: PER-000001
    label: Person A
    scenario_id: SCN-000001
    note: Solo implementer holding four roles.
    allocations:
      - {role_id: ROL-000001, scheduled_work_hours: 112, non_project_hours: 16}
      - {role_id: ROL-000004, scheduled_work_hours: 24, non_project_hours: 0}
      - {role_id: ROL-000005, scheduled_work_hours: 16, non_project_hours: 0}
      - {role_id: ROL-000006, scheduled_work_hours: 8, non_project_hours: 0}
    overrides:
      - {period: "2026-12", role_id: ROL-000001, field: unavailable_hours, value: 16, reason: planned holiday}
  - person_id: PER-000002
    label: Person B
    scenario_id: SCN-000002
    allocations:
      - {role_id: ROL-000001, scheduled_work_hours: 160, non_project_hours: 24}
  - person_id: PER-000006
    label: Person F
    scenario_id: SCN-000002
    note: Fully ramped technical specialist who mentors Person G.
    allocations:
      - {role_id: ROL-000004, scheduled_work_hours: 160, non_project_hours: 16}
    overrides:
      - {period: "2026-11", role_id: ROL-000004, field: mentor_hours, value: 24, mentee: PER-000007}
      - {period: "2026-12", role_id: ROL-000004, field: mentor_hours, value: 16, mentee: PER-000007}
